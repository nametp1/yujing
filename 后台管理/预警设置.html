<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预警设置 - SanVIST 通用预警事件中心</title>
  <style>
  :root{--red:#29BECE;--red2:#e9f9fb;--blue:#1899a8;--green:#20b26b;--orange:#fa8c16;--ink:#202936;--muted:#657080;--line:#e5e9ef;--bg:#f4f6f8;--white:#fff;--shadow:0 6px 24px rgba(26,39,60,.09)}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;color:var(--ink);background:var(--bg)}
  button,input,select,textarea{font:inherit}
  .logo{font-size:23px;font-weight:900;font-style:italic;color:var(--red);letter-spacing:-1px}
  main{margin-left:218px;padding:88px 24px 30px;min-width:1050px}
  .page{display:none}
  .page.active{display:block}
  .btn{height:36px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 15px;cursor:pointer;color:#384353}
  .btn:hover{border-color:#aeb7c3}
  .btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
  .btn.link{border:0;color:var(--blue);padding:0 5px;background:none;height:auto}
  .filters{padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .control{height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#4e5968;padding:0 11px;min-width:128px}
  .search{min-width:220px}
  .spacer{flex:1}
  .table-wrap{overflow:auto;padding:0 16px}
  .table{width:100%;border-collapse:collapse;white-space:nowrap}
  .table th{background:#f7f8fa;color:#505b69;font-weight:600;text-align:left;border:1px solid var(--line);padding:11px 12px}
  .table td{padding:12px;border-bottom:1px solid var(--line);color:#3f4956}
  .table tr:hover td{background:#fafbfd}
  .footer{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
  .pages{display:flex;gap:7px;align-items:center}
  .pages span{width:31px;height:31px;border:1px solid var(--line);display:grid;place-items:center;border-radius:5px}
  .pages .on{background:var(--red);color:#fff;border-color:var(--red)}
  .modal-mask{display:none;position:fixed;inset:0;background:rgba(22,30,40,.42);z-index:30}
  .modal-mask.open{display:block}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .x{border:0;background:none;font-size:23px;color:#7d8793;cursor:pointer}
  .modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:780px;max-height:88vh;background:#fff;border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .modal-body{padding:20px 24px;overflow:auto}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 18px}
  .field label{display:block;margin-bottom:6px;color:#4f5967}
  .field label i{color:var(--red);font-style:normal}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:#3d4652;background:#fff}
  .field textarea{min-height:68px;resize:vertical}
  .field.full{grid-column:1/-1}
  .toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#26313e;color:#fff;padding:10px 18px;border-radius:7px;z-index:60;box-shadow:var(--shadow);display:none}
  .toast.show{display:block}
  .app-wrapper{display: flex; flex-direction: column; min-height: 100vh;}
  .main-wrapper{display: flex; flex: 1; min-height: 0; overflow: hidden;}
  .main-wrapper > main{flex: 1; min-width: 0; margin: 0; padding: 24px; min-height: 0; overflow-y: auto;}
  .navbar{height: 50px; background: #172742; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0;}
  .navbar-left{display: flex; align-items: center; gap: 8px;}
  .navbar .logo{font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.5px;}
  .navbar-right{display: flex; align-items: center; gap: 20px; font-size: 14px; color: rgba(255,255,255,.72);}
  .navbar-item{display: flex; align-items: center; gap: 6px; cursor: pointer; transition: color .2s;}
  .navbar-item:hover{color: #fff;}
  .sidebar-menu{list-style: none; padding: 8px 0; margin: 0;}
  .sidebar-item{position: relative;}
  .sidebar-link{display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; color: rgba(255,255,255,.75); text-decoration: none; transition: all .2s; cursor: pointer;}
  .sidebar-link:hover{color: #fff; background: rgba(255,255,255,.07);}
  .sidebar-icon{width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;}
  .sidebar-submenu{list-style: none; padding: 0; margin: 0;}
  .sidebar-submenu .sidebar-link{padding-left: 42px; font-size: 13px;}
  .sidebar-item.active > .sidebar-link, .sidebar-link.active{background: linear-gradient(90deg, rgba(41,190,206,0) 0%, #29BECE 100%); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #29BECE;}
  .cat-group td{background:#f7f9fb;font-weight:600}
  .cat-caret{display:inline-block;width:0;height:0;border-left:6px solid #8b94a0;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:9px;transform:rotate(90deg);transition:transform .18s;cursor:pointer;vertical-align:middle}
  .cat-caret.closed{transform:rotate(0)}
  .cat-group em{font-style:normal;font-size:12px;font-weight:500;color:#8b94a0;margin-left:8px}
  .cat-child .cat-child .child-desc{color:#7a8290;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lang-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .lang-head label em{font-style:normal;font-weight:400;color:#a6adb8;font-size:12px}
  .lang-toggle{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#1899a8;background:none;border:none;cursor:pointer;font-family:inherit;padding:2px 0}
  .lang-toggle:hover{color:#29BECE}
  .lang-toggle svg{transition:transform .2s}
  .lang-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;max-height:206px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:14px;background:#fcfdfe}
  .lang-item{display:flex;align-items:center;gap:8px;min-width:0}
  .lang-item span{width:62px;flex-shrink:0;font-size:13px;color:#4e5968;white-space:nowrap}
  .lang-item input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:5px;padding:0 9px;font-size:13px;font-family:inherit;outline:none;background:#fff}
  .lang-item input:focus{border-color:#29BECE}
  
  /* 关联预警事件多选 */
  .child-events{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev-chip{display:inline-block;background:#f2f5f8;color:#5a6472;font-size:12px;padding:1px 7px;border-radius:4px;margin:1px 4px 1px 0}
  .cell-empty{color:#b6bcc4}
  .cat-child td[rowspan]{vertical-align:middle}
  .cat-child .child-events{padding-top:10px;padding-bottom:10px}
  .cfg-cats-head{font-size:12px;color:#9aa3af;padding:4px 10px 8px}
  .cfg-cat{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;color:#3a4452;position:relative}
  .cfg-cat:hover{background:#f5f9fa}
  .cfg-cat.active{background:#e9f9fb;color:#1899a8;font-weight:500}
  .cfg-cat-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cfg-cat em{flex-shrink:0;font-style:normal;font-size:11px;color:#9aa3af;background:#f0f2f4;border-radius:9px;padding:1px 6px}
  .cfg-cat-ops{display:none;gap:4px}
  .cfg-cat:hover .cfg-cat-ops{display:flex}
  .cfg-cat-ops b{font-weight:400;font-size:12px;color:#9aa3af;cursor:pointer;padding:0 2px}
  .cfg-cat-ops b:hover{color:#1899a8}
  .cfg-events-title b{font-size:15px;color:#1f2329}
  .cfg-events-title em{font-style:normal;font-size:12px;color:#9aa3af;margin-left:8px}
  .st-toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .thing-col{font-family:Menlo,Consolas,monospace;font-size:12px;color:#657080;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
  .desc-col{color:#7a8290;font-size:12.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  
  /* ==== 从预警事件页补齐 ==== */
  .drawer-mask,.modal-mask{display:none;position:fixed;inset:0;background:rgba(22,30,40,.42);z-index:30}
  
  /* ===== 管理后台深色主题导航 ===== */
  .app-wrapper{display: flex; flex-direction: column; min-height: 100vh;}
  .sidebar-item.active > .sidebar-link,
  .sidebar-link.active{background: linear-gradient(90deg, rgba(41,190,206,0) 0%, #29BECE 100%); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #29BECE;}
  .pages{display:flex;gap:7px;align-items:center}
  .pages span{width:31px;height:31px;border:1px solid var(--line);display:grid;place-items:center;border-radius:5px;font-size:13px;color:#4a5462;cursor:pointer;transition:all .14s}
  .pages span:hover{border-color:#29BECE;color:#1899a8}
  .pages .on{background:var(--red);color:#fff;border-color:var(--red)}
  .cat-child .sub-col{color:#657080;font-size:13px}
  .cat-child .cat-col{color:#4a5462;font-size:13px}
  .cat-child .sub-col{color:#657080;font-size:13px}
  .cat-child .desc-col{color:#7a8290;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .radio-row{display:flex;align-items:center;gap:18px;min-height:36px}
  .radio-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:#4a5462;cursor:pointer;white-space:nowrap}
  .radio-row input[type=radio]{width:15px;height:15px;accent-color:#29BECE;cursor:pointer;margin:0}
  .card-head .title{font-size:15px;font-weight:600;color:#1f2329}
  #evTable tbody tr:hover{background:#fafcfd}
  
  /* ==== 标签与开关 ==== */
  .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;line-height:1.7;white-space:nowrap}
  .tag.high{background:#fdecee;color:#d92b3a}
  .tag.mid{background:#fff0dc;color:#ed7b0b}
  .tag.yellow{background:#fff8e1;color:#d9a600}
  .tag.green{background:#e8f7ee;color:#1a9c5b}
  .tag.gray{background:#f0f2f4;color:#737d89}
  .tag.info{background:#e0f7fa;color:#1899a8}
  .switch{display:inline-block;position:relative;width:38px;height:20px;background:#c8cfd8;border-radius:10px;cursor:pointer;transition:background .2s;flex-shrink:0;vertical-align:middle}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
  .switch.on{background:#20b26b}
  .switch.on::after{left:20px}
  .st-txt{font-size:12.5px;color:#657080}
  .st-toggle .switch.on + .st-txt{color:#1899a8}
  
  /* ==== 布局宽度修正 ==== */
  .sidebar{flex:0 0 210px;width:210px;height:100vh;background:#1E3255;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;overflow-y:auto}
  
  /* ===== 布局（统一重写） ===== */
  html,body{height:100%;margin:0}
  body{display:flex;height:100vh;overflow:hidden;background:#f4f6f8}
  .main{flex:1 1 0;min-width:0;width:auto;height:100vh;display:flex;flex-direction:column;align-items:stretch;padding:14px 16px;box-sizing:border-box;overflow:hidden}
  .card{flex:1 1 auto;width:100%;max-width:none;min-width:0;min-height:0;margin:0;display:flex;flex-direction:column;box-sizing:border-box;background:#fff;border:1px solid #edf0f3;border-radius:10px;box-shadow:0 1px 3px rgba(20,35,55,.03);overflow:hidden}
  .card-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #f0f3f7}
  .cfg-layout{flex:1 1 auto;display:flex;align-items:stretch;width:100%;min-height:0;box-sizing:border-box;padding:0 14px 14px;gap:12px}
  .cfg-cats{flex:0 0 186px;width:186px;border-right:1px solid #edf0f3;padding:8px 10px 0 0;box-sizing:border-box;overflow-y:auto}
  .cfg-cats-head{font-size:12px;color:#9aa3af;padding:4px 8px 8px}
  .cfg-cat{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;color:#3a4452}
  .cfg-cat:hover{background:#f5f9fa}
  .cfg-cat.active{background:#e9f9fb;color:#1899a8;font-weight:500}
  .cfg-cat-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cfg-cat em{flex-shrink:0;font-style:normal;font-size:11px;color:#9aa3af;background:#f0f2f4;border-radius:9px;padding:1px 6px}
  .cfg-cat-ops{display:none;gap:4px}
  .cfg-cat:hover .cfg-cat-ops{display:flex}
  .cfg-cat-ops b{font-weight:400;font-size:12px;color:#9aa3af;cursor:pointer;padding:0 2px}
  .cfg-cat-ops b:hover{color:#1899a8}
  .cfg-events{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;box-sizing:border-box;padding-top:8px}
  .cfg-events-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px}
  .cfg-events-title b{font-size:15px;color:#1f2329}
  .cfg-events-title em{font-style:normal;font-size:12px;color:#9aa3af;margin-left:8px}
  .tbl-wrap{flex:1 1 auto;width:100%;min-height:0;overflow:auto;border:1px solid #f0f3f7;border-radius:6px}
  #evTable{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  #evTable th{background:#fafbfc;color:#3a4452;font-weight:500;font-size:12.5px;text-align:left;padding:9px 10px;border-bottom:1px solid #edf0f3;white-space:nowrap}
  #evTable td{padding:10px 10px;border-bottom:1px solid #f3f5f7;color:#3a4452;vertical-align:middle}
  #evTable tbody tr:hover{background:#fafcfd}

  /* ==== 表格列宽（铺满不溢出） ==== */
  #evTable th:nth-child(1),#evTable td:nth-child(1){width:12%}
  #evTable th:nth-child(2),#evTable td:nth-child(2){width:10%}
  #evTable th:nth-child(3),#evTable td:nth-child(3){width:9%}
  #evTable th:nth-child(4),#evTable td:nth-child(4){width:9%}
  #evTable th:nth-child(5),#evTable td:nth-child(5){width:11%}
  #evTable th:nth-child(6),#evTable td:nth-child(6){width:14%}
  #evTable th:nth-child(7),#evTable td:nth-child(7){width:14%}
  #evTable th:nth-child(8),#evTable td:nth-child(8){width:15%}
  #evTable th:nth-child(9),#evTable td:nth-child(9){width:6%}
  #evTable th{white-space:normal;line-height:1.4}
  #evTable td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #evTable td b{font-weight:600}
  .cfg-events{overflow:hidden}
  .tbl-wrap{width:100%;overflow-x:hidden;overflow-y:auto}
  .cfg-cat-btn{flex-shrink:0;margin-left:2px;padding:1px 6px;font-size:11px;line-height:1.6;
    color:#1899a8;background:#e9f9fb;border:0;border-radius:4px;cursor:pointer;font-family:inherit}
  .cfg-cat-btn:hover{background:#d4f2f6}
  .cfg-cat.active .cfg-cat-btn{background:#fff;color:#1899a8}
</style>
</head>

<body>
<aside class="sidebar">
      <ul class="sidebar-menu">
        <li class="sidebar-item active">
          <a class="sidebar-link">
            <span class="sidebar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
            预警中心
          </a>
          <ul class="sidebar-submenu">
            <li class="sidebar-item"><a class="sidebar-link" href="预警等级.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h4V10H3z"/><path d="M10 20h4V4h-4z"/><path d="M17 20h4v-7h-4z"/></svg> 预警等级</a></li>
            <li class="sidebar-item active"><a class="sidebar-link" href="预警设置.html" class="active" class="active"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 3 12V5a2 2 0 0 1 2-2h7a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.6z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg> 预警设置</a></li>
            <li class="sidebar-item"></li><li class="sidebar-item"><a class="sidebar-link" href="租户设置.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;vertical-align:-2px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>租户设置</a></li>
          </ul>
        </li>
      </ul>
    </aside>
  <main class="main">

    <div class="card">
      <div class="card-head">
        <div class="title">预警设置</div>
        <button class="btn primary" onclick="newCategory()">＋ 新增分类</button>
      </div>
      <div class="cfg-layout">
        <div class="cfg-cats">
          <div class="cfg-cats-head">分类</div>
          <div id="catList"></div>
        </div>
        <div class="cfg-events">
          <div class="cfg-events-head">
            <div class="cfg-events-title"><b id="curCatName">-</b><em id="curCatCount"></em></div>
            <button class="btn primary" onclick="newEvent()">＋ 新增预警事件</button>
          </div>
          <div class="tbl-wrap">
            <table class="table" id="evTable">
              <thead>
                <tr>
                  <th>预警事件</th>
                  <th>预警等级</th>
                  <th>状态</th>
                  <th>是否审核</th>
                  <th>是否预警处理</th>
                  <th>是否支持阈值配置</th>
                  <th>物模型 ID</th>
                  <th>预警说明</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="evBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 分类弹窗 -->
  <div class="modal-mask" id="catModal" onclick="maskClose(event,'catModal')">
    <div class="modal" style="width:480px">
      <div class="modal-head"><b style="font-size:18px" id="catTitle">新增分类</b><button class="x" onclick="closeLayer('catModal')">×</button></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field full"><label><i>*</i> 分类名称</label><input id="catName" placeholder="如 设备异常"/></div>
          <div class="field full"><label>备注</label><input id="catDesc" placeholder="选填"/></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeLayer('catModal')">取消</button>
        <button class="btn primary" onclick="saveCat()">保存</button>
      </div>
    </div>
  </div>

  <!-- 事件弹窗 -->
  <div class="modal-mask" id="evModal" onclick="maskClose(event,'evModal')">
    <div class="modal" style="width:720px">
      <div class="modal-head"><b style="font-size:18px" id="evTitle">新增预警事件</b><button class="x" onclick="closeLayer('evModal')">×</button></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label><i>*</i> 事件名称</label><input id="evName" placeholder="如 冷却水温高"/></div>
          <div class="field"><label>预警等级</label><select id="evLevel"><option>高危</option><option>中危</option><option>低危</option><option>提示</option></select></div>
          <div class="field"><label>状态</label><div class="radio-row"><label><input type="radio" name="evStatus" value="1" checked/> 开启</label><label><input type="radio" name="evStatus" value="0"/> 关闭</label></div></div>
          <div class="field"><label>是否审核</label><div class="radio-row"><label><input type="radio" name="evAudit" value="1" checked/> 是</label><label><input type="radio" name="evAudit" value="0"/> 否</label></div></div>
          <div class="field"><label>是否预警处理</label><div class="radio-row"><label><input type="radio" name="evProc" value="1" checked/> 是</label><label><input type="radio" name="evProc" value="0"/> 否</label></div></div>
          <div class="field"><label>是否支持阈值配置</label><div class="radio-row"><label><input type="radio" name="evTh" value="1" checked/> 是</label><label><input type="radio" name="evTh" value="0"/> 否</label></div></div>
          <div class="field full"><label>物模型 ID</label><textarea id="evThing" placeholder="多个 ID 用英文分号 ; 分隔" style="min-height:60px"></textarea></div>
          <div class="field full"><label>预警说明</label><textarea id="evDesc" placeholder="选填" style="min-height:60px"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeLayer('catModal')" style="display:none"></button>
        <button class="btn" onclick="closeLayer('evModal')">取消</button>
        <button class="btn primary" onclick="saveEv()">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="modal-mask" id="delModal" onclick="maskClose(event,'delModal')">
    <div class="modal" style="width:400px">
      <div class="modal-head"><b style="font-size:18px">确认删除</b><button class="x" onclick="closeLayer('delModal')">×</button></div>
      <div class="modal-body"><p id="delTip" style="margin:0;font-size:14px;line-height:1.7;color:#4a5462">确定要删除吗？删除后不可恢复。</p></div>
      <div class="modal-foot">
        <button class="btn" onclick="closeLayer('delModal')">取消</button>
        <button class="btn primary" onclick="doDel()">确认删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var CATS = [
    { name: '设备异常', desc: '设备冷却液温度超过安全阈值时触发' },
    { name: '作业安全', desc: '设备怠速停车时长超过配置阈值' },
    { name: '位置', desc: '设备驶出预设电子围栏范围' },
    { name: '燃油', desc: '燃油消耗速率异常波动' },
    { name: '保养', desc: '' },
    { name: '提示', desc: '停车状态提示，不属于危险等级' }
  ];

  var EVENTS = [
    { cat: '设备异常', name: '冷却水温高', level: '高危', on: 1, audit: 1, proc: 1, th: 1, thing: 'WL-CoolantTemp;WL-EngineTemp', desc: '设备冷却液温度超过安全阈值' },
    { cat: '设备异常', name: '液压油温度高', level: '高危', on: 1, audit: 1, proc: 1, th: 1, thing: 'WL-HydOilTemp', desc: '液压系统油温异常升高' },
    { cat: '设备异常', name: '设备离线', level: '中危', on: 1, audit: 1, proc: 0, th: 1, thing: 'WL-Offline', desc: '设备连续未上报数据' },
    { cat: '设备异常', name: '故障码', level: '中危', on: 1, audit: 0, proc: 1, th: 1, thing: 'WL-FaultCode', desc: '设备上报故障码时自动生成' },
    { cat: '作业安全', name: '危险力矩', level: '高危', on: 1, audit: 1, proc: 1, th: 1, thing: 'WL-Torque', desc: '作业力矩超过安全阈值' },
    { cat: '作业安全', name: '超速', level: '高危', on: 1, audit: 1, proc: 1, th: 1, thing: 'WL-Speed', desc: '行驶速度超过安全上限' },
    { cat: '作业安全', name: '疲劳驾驶', level: '中危', on: 1, audit: 1, proc: 0, th: 0, thing: 'WL-Fatigue', desc: '连续驾驶时长超过安全上限' },
    { cat: '作业安全', name: '主动安全报警', level: '中危', on: 0, audit: 0, proc: 0, th: 0, thing: 'WL-ActiveSafety', desc: 'AI 识别到现场安全隐患' },
    { cat: '位置', name: '电子围栏报警', level: '中危', on: 1, audit: 1, proc: 1, th: 1, thing: 'WL-GeoFence', desc: '设备驶出预设电子围栏范围' },
    { cat: '燃油', name: '油耗异常', level: '低危', on: 1, audit: 0, proc: 1, th: 1, thing: 'WL-FuelRate', desc: '燃油消耗速率偏离正常区间' },
    { cat: '燃油', name: '燃油液位偏低', level: '低危', on: 1, audit: 1, proc: 1, th: 1, thing: 'WL-FuelLevel', desc: '油箱液位低于安全阈值' },
    { cat: '提示', name: '保养临期', level: '提示', on: 1, audit: 0, proc: 0, th: 0, thing: 'WL-Maintain', desc: '保养周期临近提醒' }
  ];

  var curCat = CATS[0].name;
  var editCatIdx = -1;
  var editEvIdx = -1;
  var delTarget = null;

  var LV_CLS = { '高危': 'high', '中危': 'mid', '低危': 'yellow', '提示': 'green' };

  function toast(msg){
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  function openLayer(id){ document.getElementById(id).classList.add('show'); }
  function closeLayer(id){ document.getElementById(id).classList.remove('show'); }
  function maskClose(e, id){ if (e.target.id === id) closeLayer(id); }

  function renderCats(){
    var box = document.getElementById('catList');
    box.innerHTML = CATS.map(function (c, i) {
      var n = EVENTS.filter(function (e) { return e.cat === c.name; }).length;
      return '<div class="cfg-cat' + (c.name === curCat ? ' active' : '') + '" onclick="selectCat(\'' + c.name + '\')">'
        + '<span class="cfg-cat-name">' + c.name + '</span>'
        + '<em>' + n + '</em>'
        + '<button class="cfg-cat-btn" onclick="event.stopPropagation();selectCat(\'' + c.name + '\');toast(\'正在维护「' + c.name + '」\')">配置</button>'
        + '<span class="cfg-cat-ops">'
        + '<b title="编辑分类" onclick="event.stopPropagation();editCat(' + i + ')">✎</b>'
        + '<b title="删除分类" onclick="event.stopPropagation();delCat(' + i + ')">✕</b>'
        + '</span></div>';
    }).join('');
  }

  function selectCat(name){
    curCat = name;
    renderCats();
    renderEvents();
  }

  function renderEvents(){
    var c = CATS.filter(function (x) { return x.name === curCat; })[0] || {};
    document.getElementById('curCatName').textContent = curCat;
    var list = EVENTS.filter(function (e) { return e.cat === curCat; });
    document.getElementById('curCatCount').textContent = list.length;

    var body = document.getElementById('evBody');
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#9aa3af;padding:32px">该分类下暂无预警事件</td></tr>';
      return;
    }

    body.innerHTML = list.map(function (e) {
      var idx = EVENTS.indexOf(e);
      var tag = function (v) { return v ? '<span class="tag info">是</span>' : '<span class="tag gray">否</span>'; };
      return '<tr>'
        + '<td><b>' + e.name + '</b></td>'
        + '<td><span class="tag ' + (LV_CLS[e.level] || 'gray') + '">' + e.level + '</span></td>'
        + '<td><span class="st-toggle" onclick="toggleOn(' + idx + ')">'
          + '<span class="switch' + (e.on ? ' on' : '') + '"></span>'
          + '<span class="st-txt">' + (e.on ? '开启' : '关闭') + '</span></span></td>'
        + '<td>' + tag(e.audit) + '</td>'
        + '<td>' + tag(e.proc) + '</td>'
        + '<td>' + tag(e.th) + '</td>'
        + '<td class="thing-col" title="' + (e.thing || '') + '">' + (e.thing || '-') + '</td>'
        + '<td class="desc-col" title="' + (e.desc || '') + '">' + (e.desc || '-') + '</td>'
        + '<td><button class="btn link" onclick="editEv(' + idx + ')">编辑</button>'
        + '<button class="btn link" style="color:var(--red)" onclick="delEv(' + idx + ')">删除</button></td>'
        + '</tr>';
    }).join('');
  }

  function toggleOn(idx){
    EVENTS[idx].on = EVENTS[idx].on ? 0 : 1;
    renderEvents();
  }

  // ---- 分类 ----
  function newCategory(){
    editCatIdx = -1;
    document.getElementById('catTitle').textContent = '新增分类';
    document.getElementById('catName').value = '';
    document.getElementById('catDesc').value = '';
    openLayer('catModal');
  }

  function editCat(i){
    editCatIdx = i;
    document.getElementById('catTitle').textContent = '编辑分类';
    document.getElementById('catName').value = CATS[i].name;
    document.getElementById('catDesc').value = CATS[i].desc || '';
    openLayer('catModal');
  }

  function saveCat(){
    var name = (document.getElementById('catName').value || '').trim();
    var desc = (document.getElementById('catDesc').value || '').trim();
    if (!name) { toast('请填写分类名称'); return; }

    if (editCatIdx >= 0) {
      var old = CATS[editCatIdx].name;
      CATS[editCatIdx].name = name;
      CATS[editCatIdx].desc = desc;
      EVENTS.forEach(function (e) { if (e.cat === old) e.cat = name; });
      if (curCat === old) curCat = name;
    } else {
      CATS.push({ name: name, desc: desc });
      curCat = name;
    }
    closeLayer('catModal');
    renderCats();
    renderEvents();
    toast('分类已保存');
  }

  function delCat(i){
    delTarget = { type: 'cat', idx: i };
    var n = EVENTS.filter(function (e) { return e.cat === CATS[i].name; }).length;
    document.getElementById('delTip').textContent =
      '确定要删除分类「' + CATS[i].name + '」吗？' + (n ? '该分类下的 ' + n + ' 个预警事件将一并删除。' : '');
    openLayer('delModal');
  }

  function doDel(){
    if (!delTarget) return;
    if (delTarget.type === 'cat') {
      var name = CATS[delTarget.idx].name;
      EVENTS = EVENTS.filter(function (e) { return e.cat !== name; });
      CATS.splice(delTarget.idx, 1);
      if (curCat === name) curCat = CATS.length ? CATS[0].name : '';
    } else {
      EVENTS.splice(delTarget.idx, 1);
    }
    delTarget = null;
    closeLayer('delModal');
    renderCats();
    renderEvents();
    toast('已删除');
  }

  // ---- 事件 ----
  function newEvent(){
    if (!curCat) { toast('请先选择分类'); return; }
    editEvIdx = -1;
    document.getElementById('evTitle').textContent = '新增预警事件';
    document.getElementById('evName').value = '';
    document.getElementById('evLevel').selectedIndex = 1;
    document.getElementById('evThing').value = '';
    document.getElementById('evDesc').value = '';
    document.querySelector('input[name="evStatus"][value="1"]').checked = true;
    document.querySelector('input[name="evAudit"][value="1"]').checked = true;
    document.querySelector('input[name="evProc"][value="1"]').checked = true;
    document.querySelector('input[name="evTh"][value="1"]').checked = true;
    openLayer('evModal');
  }

  function editEv(idx){
    editEvIdx = idx;
    var e = EVENTS[idx];
    document.getElementById('evTitle').textContent = '编辑预警事件';
    document.getElementById('evName').value = e.name;
    document.getElementById('evLevel').value = e.level;
    document.getElementById('evThing').value = e.thing || '';
    document.getElementById('evDesc').value = e.desc || '';
    document.querySelector('input[name="evStatus"][value="' + (e.on ? '1' : '0') + '"]').checked = true;
    document.querySelector('input[name="evAudit"][value="' + (e.audit ? '1' : '0') + '"]').checked = true;
    document.querySelector('input[name="evProc"][value="' + (e.proc ? '1' : '0') + '"]').checked = true;
    document.querySelector('input[name="evTh"][value="' + (e.th ? '1' : '0') + '"]').checked = true;
    openLayer('evModal');
  }

  function saveEv(){
    var name = (document.getElementById('evName').value || '').trim();
    if (!name) { toast('请填写事件名称'); return; }
    var obj = {
      cat: curCat,
      name: name,
      level: document.getElementById('evLevel').value,
      on: document.querySelector('input[name="evStatus"]:checked').value === '1' ? 1 : 0,
      audit: document.querySelector('input[name="evAudit"]:checked').value === '1' ? 1 : 0,
      proc: document.querySelector('input[name="evProc"]:checked').value === '1' ? 1 : 0,
      th: document.querySelector('input[name="evTh"]:checked').value === '1' ? 1 : 0,
      thing: (document.getElementById('evThing').value || '').trim(),
      desc: (document.getElementById('evDesc').value || '').trim()
    };
    if (editEvIdx >= 0) EVENTS[editEvIdx] = obj;
    else EVENTS.push(obj);
    closeLayer('evModal');
    renderCats();
    renderEvents();
    toast('预警事件已保存');
  }

  function delEv(idx){
    delTarget = { type: 'ev', idx: idx };
    document.getElementById('delTip').textContent = '确定要删除该预警事件吗？删除后不可恢复。';
    openLayer('delModal');
  }

  renderCats();
  renderEvents();
</script>

</body>
</html>
