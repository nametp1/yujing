<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>预警设置 - SanVIST 设备智能监控平台</title>
<style>
    :root{--red:#29BECE;--red2:#e9f9fb;--blue:#1899a8;--green:#20b26b;--orange:#fa8c16;--ink:#202936;--muted:#657080;--line:#e5e9ef;--bg:#f4f6f8;--white:#fff;--shadow:0 6px 24px rgba(26,39,60,.09)}
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.logo{font-size:23px;font-weight:900;font-style:italic;color:var(--red);letter-spacing:-1px}.avatar{width:31px;height:31px;border-radius:50%;background:#dbe9ff;display:grid;place-items:center}.nav:hover{background:#f6f7f9}.nav.active{background:var(--red2);color:var(--red);font-weight:650}.nav.active small{background:#fff;color:var(--red)}
    main{margin-left:218px;padding:88px 24px 30px;min-width:1050px}.page{display:none}.page.active{display:block}.page-head{display:flex;justify-content:flex-end;align-items:center;margin-bottom:18px}.page-head h1{margin:0 0 4px;font-size:24px}.page-head p{margin:0;color:var(--muted)}
    .btn{height:36px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 15px;cursor:pointer;color:#384353}.btn:hover{border-color:#aeb7c3}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.btn.link{border:0;color:var(--blue);padding:0 5px;background:none;height:auto}.btn.danger{color:var(--red)}
    .card{background:#fff;border:1px solid #edf0f3;border-radius:10px;box-shadow:0 1px 3px rgba(20,35,55,.03);margin-bottom:16px}.filters{padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.control{height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#4e5968;padding:0 11px;min-width:128px}.spacer{flex:1}.notice{padding:12px 15px;background:#eef7ff;color:#3574b8;border-radius:7px;margin:16px;display:flex;gap:10px}.notice b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#4694ef;color:#fff;font-size:12px}
    .table-wrap{overflow:auto;padding:0 16px}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{background:#f7f8fa;color:#505b69;font-weight:600;text-align:left;border:1px solid var(--line);padding:11px 12px}.table td{padding:12px;border-bottom:1px solid var(--line);color:#3f4956}.table tr:hover td{background:#fafbfd}.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:12px;font-size:12px}.tag.high{background:#e0f7fa;color:#1899a8}.tag.mid{background:#fff0dc;color:#ed7b0b}.tag.yellow{background:#fff7df;color:#ad7a00}.tag.green{background:#e9f7ef;color:#17945b}.tag.low{background:#eef2f5;color:#657080}.tag.info{background:#e9f7ef;color:#17945b}.tag.gray{background:#f0f2f4;color:#737d89}.dot:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}.pages .on{background:var(--red);color:#fff;border-color:var(--red)}.tab{padding:15px 2px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--red);border-color:var(--red);font-weight:650}.sub{display:block;font-size:12px;color:#929ba7;margin-top:1px}.arrow{color:#a3abb6}.drawer-head,.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.drawer-foot,.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.x{border:0;background:none;font-size:23px;color:#7d8793;cursor:pointer}.time-item:before{content:"";position:absolute;width:9px;height:9px;background:#fff;border:2px solid var(--blue);border-radius:50%;left:-25px;top:4px}.modal-body{padding:20px 24px;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 18px}.field label{display:block;margin-bottom:6px;color:#4f5967}.field label i{color:var(--red);font-style:normal}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:#3d4652;background:#fff}.field textarea{min-height:68px;resize:vertical}.field.full{grid-column:1/-1}.radio-row{display:flex;gap:20px;padding-top:7px}.switch{width:36px;height:20px;border-radius:10px;background:#c8ced6;position:relative;display:inline-block;vertical-align:middle;cursor:pointer}.switch:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--green)}.switch.on:after{left:18px}.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#26313e;color:#fff;padding:10px 18px;border-radius:7px;z-index:300;box-shadow:var(--shadow);display:none}.toast.show{display:block}
  
    /* ===== 后台管理导航样式 ===== */
  .logo{font-size:23px;font-weight:900;font-style:italic;color:var(--red);letter-spacing:-1px}
  .app-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
  .main-wrapper { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .main-wrapper > main { flex: 1; min-width: 0; margin: 0; padding: 24px; min-height: 0; overflow-y: auto; }
  .navbar {
    height: 50px; background: #172742; border-bottom: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; flex-shrink: 0;
  }
  .navbar-left { display: flex; align-items: center; gap: 8px; }
  .navbar .logo { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .navbar-right { display: flex; align-items: center; gap: 20px; font-size: 14px; color: rgba(255,255,255,.72); }
  .navbar-item { display: flex; align-items: center; gap: 6px; cursor: pointer; transition: color .2s; }
  .navbar-item:hover { color: #fff; }
  .sidebar {
    width: 210px; background: #1E3255; border-right: 1px solid rgba(255,255,255,.06);
    display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
  }
  .sidebar-menu { list-style: none; padding: 8px 0; margin: 0; }
  .sidebar-item { position: relative; }
  .sidebar-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    font-size: 14px; color: rgba(255,255,255,.75); text-decoration: none;
    transition: all .2s; cursor: pointer;
  }
  .sidebar-link:hover { color: #fff; background: rgba(255,255,255,.07); }
  .sidebar-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sidebar-submenu { list-style: none; padding: 0; margin: 0; }
  .sidebar-submenu .sidebar-link { padding-left: 42px; font-size: 13px; }
  .sidebar-item.active > .sidebar-link,
  .sidebar-link.active {
    background: linear-gradient(90deg, rgba(41,190,206,0) 0%, #29BECE 100%);
    color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #29BECE;
  }

  .ev-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;padding:14px;background:#fcfdfe}
  .ev-opt{display:flex;align-items:center;gap:9px;font-size:13px;color:#3f4956;cursor:pointer;padding:6px 8px;border-radius:5px;transition:background .12s}
  .ev-opt:hover{background:#f2fbfc}
  .ev-opt input{accent-color:#29BECE}
  .ev-stat .tag{margin-right:6px}

  .cfg-ev:hover{background:#f6fbfc}
  .cfg-th:focus{border-color:#29BECE}
  .ev-panel::-webkit-scrollbar{width:6px}
  .ev-panel::-webkit-scrollbar-thumb{background:#d8dee6;border-radius:3px}
  .cfg-ev{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 16px 7px 34px;transition:background .12s}
  .cfg-ev:hover{background:#f6fbfc}
  .cfg-th{height:30px;border:1px solid #dfe4ea;border-radius:6px;padding:0 8px;font-size:12px;font-family:inherit;color:#3f4956;background:#fff;outline:none;min-width:116px;cursor:pointer;transition:border-color .16s}
  .cfg-th:hover{border-color:#ade4ea}
  .cfg-th:focus{border-color:#29BECE;box-shadow:0 0 0 2px rgba(41,190,206,.12)}
  .cat-caret{display:inline-block;width:0;height:0;border-left:5px solid #9aa3af;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;margin-right:9px;transform:rotate(90deg);transition:transform .18s;vertical-align:middle}
  
  .cfg-ev{gap:10px}
  .cfg-ev{justify-content:space-between}
  .dev-panel{flex:1;min-width:0;display:flex;flex-direction:column}
  .dev-toolbar{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #f0f3f7;background:#fbfcfd}
  .dev-all{display:flex;align-items:center;gap:6px;font-size:13px;color:#4a5462;cursor:pointer;white-space:nowrap}
  .dev-all input{accent-color:#29BECE}
  .dev-group-head{padding:9px 14px;background:#f5f7fa;font-size:13px;font-weight:600;color:#202936;position:sticky;top:0}
  .dev-group-head em{font-style:normal;font-size:11px;font-weight:500;color:#8b94a0;margin-left:8px}
  .dev-item{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 26px;font-size:13px;color:#3f4956;cursor:pointer;border-bottom:1px solid #f6f8fa}
  .dev-item:hover{background:#f6fbfc}
  .dev-item input{width:15px;height:15px;accent-color:#29BECE;cursor:pointer}
  .dev-sel-count{display:inline-flex;align-items:center;gap:5px;margin-right:auto;font-size:13px;color:#4a5462;background:#f2f5f8;border-radius:14px;padding:5px 14px}
  .dev-sel-count b{color:#1899a8;font-size:15px}
  .dh-name{padding-left:23px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dh-alias{text-align:center}
  .dh-th{}

  /* 设备阈值配置弹窗 */
  .dm-title{display:flex;align-items:center;gap:10px}
  .dm-icon{width:30px;height:30px;border-radius:8px;background:#e9f9fb;color:#1899a8;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .dm-tag{font-size:12px;color:#1899a8;background:#e9f9fb;border-radius:11px;padding:3px 11px;font-weight:500}
  .dm-search{display:flex;align-items:center;gap:8px;flex:1;height:32px;border:1px solid #e2e7ee;border-radius:7px;padding:0 11px;background:#fff;transition:border-color .16s}
  .dm-search:focus-within{border-color:#29BECE;box-shadow:0 0 0 2px rgba(41,190,206,.1)}
  .dm-search svg{color:#a8b0bb;flex-shrink:0}
  .dm-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px;font-family:inherit;color:#202936}
  .dm-search input::placeholder{color:#b6bcc4}

  .dev-split{display:flex;gap:0;border:1px solid #e8ecf1;border-radius:10px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}

  .dev-toolbar{padding:11px 14px;gap:12px}
  .dev-alias-txt{font-size:11.5px;letter-spacing:.3px;font-weight:500;color:#657080;font-family:ui-monospace,Menlo,monospace;text-align:center;background:#f4f6f8;border-radius:4px;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev-default{background:#f2fbfc}
  .dev-default:hover{background:#e9f8fa}
  .dev-default .dev-name{color:#1899a8;font-weight:500}
  .dev-sel-count{display:inline-flex;align-items:center;gap:5px;margin-right:auto;font-size:13px;color:#4a5462;background:#f2f5f8;border-radius:14px;padding:5px 14px}
  .dev-sel-count b{color:#1899a8;font-size:14px}
  #deviceModal .modal-foot{background:#fbfcfd;border-top:1px solid #eef1f5}
  #deviceModal .btn.primary{box-shadow:0 2px 8px rgba(41,190,206,.28)}
  .footer{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

  #deviceModal{z-index:200}
  #deviceModal .modal{box-shadow:0 24px 64px rgba(20,30,45,.32)}

  .pages{display:flex;gap:7px;align-items:center}
  .pages span{width:31px;height:31px;border:1px solid var(--line);display:grid;place-items:center;border-radius:5px;font-size:13px;color:#4a5462;cursor:pointer;transition:all .14s}
  .pages span:hover{border-color:#29BECE;color:#1899a8}
  .pages .on{background:var(--red);color:#fff;border-color:var(--red)}
  .dev-grouplabel{padding:8px 14px 4px;font-size:12px;color:#8b94a0;font-weight:500;background:#fbfcfd;border-bottom:1px solid #f0f3f7}
  .dev-grouprow{background:#f2fbfc}
  .dev-grouprow:hover{background:#e9f8fa}
  .dev-grouprow .dev-name{color:#1899a8;font-weight:500}

  /* 租户多选下拉 */
  .tms{position:relative}
  .tms-head{min-height:36px;border:1px solid var(--line);border-radius:6px;padding:5px 28px 5px 10px;
    cursor:pointer;display:flex;align-items:center;flex-wrap:wrap;gap:4px;background:#fff;box-sizing:border-box}
  .tms-head:hover{border-color:#c8d2de}
  .tms-tag{display:inline-flex;align-items:center;gap:4px;background:#e9f9fb;color:#1899a8;
    border-radius:4px;padding:1px 6px;font-size:12px;line-height:1.7}
  .tms-tag b{font-weight:400;cursor:pointer;font-size:13px;line-height:1}
  .tms-tag b:hover{color:#e60012}
  .tms-ph{color:#9aa3af;font-size:13px}
  .tms-arrow{position:absolute;right:10px;top:18px;color:#9aa3af;font-size:12px;transition:transform .18s;pointer-events:none}
  .tms.open .tms-arrow{transform:rotate(180deg)}
  .tms-panel{display:none;margin-top:4px;max-height:200px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 4px 14px rgba(20,35,55,.06)}
  .tms.open .tms-panel{display:block}
  .tms-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:#3a4452}
  .tms-item:hover{background:#f5f9fa}
  .tms-item input{margin:0;flex-shrink:0}
  .tms-empty{padding:10px;color:#9aa3af;font-size:12.5px;text-align:center}
  .tenant-info{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
  .cfg-ev label{display:flex;align-items:center;gap:7px;cursor:pointer;flex:1;min-width:0;font-size:13px;color:#3a4452}
  .cfg-ev label input{margin:0;flex-shrink:0}
  .uid-col{font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#657080}
  .ev-split{display:flex;min-height:300px;max-height:400px;border:1px solid #e5e9ef;border-radius:8px;overflow:hidden;background:#fff}
  .ev-cats{width:146px;flex-shrink:0;background:#f7f9fb;border-right:1px solid #eef1f5;overflow-y:auto;padding:6px 0}
  .ev-cat{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;font-size:13px;color:#4a5462;cursor:pointer;transition:background .14s}
  .ev-cat:hover{background:#eef7f9}
  .ev-cat.active{background:#e9f9fb;color:#1899a8;font-weight:600;box-shadow:inset 3px 0 0 #29BECE}
  .ev-cat em{font-style:normal;font-size:11px;color:#9aa3af;background:#eef1f5;border-radius:9px;padding:0 6px;line-height:16px}
  .ev-cat.active em{background:#fff;color:#1899a8}
  .ev-panel{flex:1;min-width:0;overflow-y:auto;padding:4px 0}
  .ev-cat-body{display:none}
  .ev-cat-body.active{display:block}
  .ev-cat input.cat-all{margin:0;flex-shrink:0;cursor:pointer;accent-color:#29BECE}
  .ev-cat-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ==== 弹窗与表单基础 ==== */
  .modal-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid #f0f3f7}
  .modal-head .x{border:0;background:none;font-size:22px;line-height:1;color:#9aa3af;cursor:pointer;padding:0 4px}
  .modal-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 20px}
  .modal-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid #f0f3f7;background:#fcfdfe}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field.full{grid-column:1/-1}
  .field > label{font-size:13px;color:#3a4452;line-height:1.4}
  .field > label i{color:#e60012;font-style:normal;margin-right:3px}
  .field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;color:#3a4452;background:#fff;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#29BECE;box-shadow:0 0 0 2px rgba(41,190,206,.12)}
  .field input[readonly],.field input:disabled{background:#f7f8fa;color:#657080}
  .field textarea{resize:vertical;min-height:60px;line-height:1.6}
  .ev-cnt{font-size:13px;color:#657080}
  .ev-cnt b{color:#1899a8;font-weight:600}

  .modal-mask{display:none;position:fixed;inset:0;background:rgba(20,35,55,.45);z-index:200}
  .modal-mask.open{display:block}
  .modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:780px;max-height:88vh;background:#fff;border-radius:10px;box-shadow:0 24px 64px rgba(20,35,55,.22);display:flex;flex-direction:column;overflow:hidden;z-index:201}

  .catm-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f3f5f7}
  .catm-row:last-child{border-bottom:0}
  .catm-name{flex:1;min-width:0;font-size:13.5px;color:#3a4452}
  .catm-row em{font-style:normal;font-size:11px;color:#1899a8;background:#e3f7fa;border-radius:9px;padding:1px 7px}

  /* 页面结构与显示修复 */
  html, body { min-height:100%; }
  body { min-width:320px; }
  .app-wrapper { min-height:100vh; }
  .main-wrapper { min-height:calc(100vh - 50px); }
  .main-wrapper > main.main { flex:1; min-width:0; width:calc(100% - 210px); margin:0; padding:24px; overflow-x:hidden; }
  .sidebar { min-height:calc(100vh - 50px); }
  .card { overflow:hidden; }
  .card-head { min-height:62px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:14px; border-bottom:1px solid #edf0f3; }
  .card-head .title { font-size:17px; font-weight:650; color:#202936; }
  .filters { padding:14px 18px; }
  .filters .search { flex:1 1 220px; min-width:180px; }
  .table-wrap { width:100%; overflow-x:auto; padding:0 16px 14px; }
  .table { min-width:1120px; width:100%; }
  .table th { position:sticky; top:0; z-index:1; }
  .table td { max-width:260px; }
  .thing-col { max-width:190px; overflow:hidden; text-overflow:ellipsis; }
  .desc-col { max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .st-toggle { display:inline-flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap; }
  @media (max-width:900px) {
    .navbar { padding:0 14px; }
    .navbar-right { gap:10px; }
    .main-wrapper > main.main { padding:16px; }
    .sidebar { width:180px; }
    .main-wrapper > main.main { width:calc(100% - 180px); }
    .filters .spacer { display:none; }
  }
  @media (max-width:640px) {
    .navbar-right .navbar-item:first-child { display:none; }
    .sidebar { width:58px; }
    .sidebar-link { justify-content:center; padding:12px 8px; font-size:0; }
    .sidebar-link svg, .sidebar-icon { flex:0 0 18px; }
    .sidebar-submenu .sidebar-link { padding-left:8px; }
    .main-wrapper > main.main { width:calc(100% - 58px); padding:12px; }
    .card-head { align-items:flex-start; flex-direction:column; }
    .filters { align-items:stretch; }
    .filters .control, .filters .btn { flex:1 1 100%; width:100%; }
    .form-grid { grid-template-columns:1fr; }
    .field.full { grid-column:auto; }
    .modal { width:calc(100vw - 24px) !important; max-height:90vh; }
  }

  /* 右侧分类导航与页面交互增强 */
  .content-layout{display:flex;flex-direction:column;gap:12px}
  .event-card{min-width:0}
  .category-rail{background:#fff;border:1px solid #edf0f3;border-radius:10px;box-shadow:0 1px 3px rgba(20,35,55,.03);overflow:hidden}
  .category-rail-head{padding:16px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .category-rail-title{font-size:15px;font-weight:650;color:#202936}
  .category-rail-list{display:flex;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}

  <script>
  var DEFAULT_CATS = [
    {name:'设备异常',key:'device_abnormal',desc:'设备运行参数异常或故障'},
    {name:'作业安全',key:'work_safety',desc:'作业过程中的安全风险'},
    {name:'位置',key:'location',desc:'设备位置及电子围栏异常'},
    {name:'燃油',key:'fuel',desc:'燃油消耗及液位异常'},
    {name:'保养',key:'maintenance',desc:'设备保养提醒'},
    {name:'提示',key:'notice',desc:'一般状态提示'}
  ];
  var DEFAULT_EVENTS = [
    {cat:'设备异常',name:'冷却水温高',key:'coolant_temp_high',level:'高危',on:1,audit:1,proc:1,th:1,thing:'WL-CoolantTemp;WL-EngineTemp',desc:'设备冷却液温度超过安全阈值'},
    {cat:'设备异常',name:'液压油温度高',key:'hyd_oil_temp_high',level:'高危',on:1,audit:1,proc:1,th:1,thing:'WL-HydOilTemp',desc:'液压系统油温异常升高'},
    {cat:'设备异常',name:'设备离线',key:'device_offline',level:'中危',on:1,audit:1,proc:0,th:1,thing:'WL-Offline',desc:'设备连续未上报数据'},
    {cat:'设备异常',name:'故障码',key:'fault_code',level:'中危',on:1,audit:0,proc:1,th:1,thing:'WL-FaultCode',desc:'设备上报故障码时自动生成'},
    {cat:'作业安全',name:'危险力矩',key:'dangerous_torque',level:'高危',on:1,audit:1,proc:1,th:1,thing:'WL-Torque',desc:'作业力矩超过安全阈值'},
    {cat:'作业安全',name:'超速',key:'overspeed',level:'高危',on:1,audit:1,proc:1,th:1,thing:'WL-Speed',desc:'行驶速度超过安全上限'},
    {cat:'作业安全',name:'疲劳驾驶',key:'fatigue_driving',level:'中危',on:1,audit:1,proc:0,th:0,thing:'WL-Fatigue',desc:'连续驾驶时长超过安全上限'},
    {cat:'作业安全',name:'主动安全报警',key:'active_safety_alarm',level:'中危',on:0,audit:0,proc:0,th:0,thing:'WL-ActiveSafety',desc:'AI 识别到现场安全隐患'},
    {cat:'位置',name:'电子围栏报警',key:'geofence_alarm',level:'中危',on:1,audit:1,proc:1,th:1,thing:'WL-GeoFence',desc:'设备驶出预设电子围栏范围'},
    {cat:'燃油',name:'油耗异常',key:'fuel_abnormal',level:'低危',on:1,audit:0,proc:1,th:1,thing:'WL-FuelRate',desc:'燃油消耗速率偏离正常区间'},
    {cat:'燃油',name:'燃油液位偏低',key:'fuel_level_low',level:'低危',on:1,audit:1,proc:1,th:1,thing:'WL-FuelLevel',desc:'油箱液位低于安全阈值'},
    {cat:'提示',name:'保养临期',key:'maintenance_due',level:'提示',on:1,audit:0,proc:0,th:0,thing:'WL-Maintain',desc:'保养周期临近提醒'}
  ];
  var STORAGE_KEY='sanvist_alert_settings_v2';
  var CATS=[], EVENTS=[], curEvIdx=-1, curCatIdx=-1, delTarget=null, activeCategory='';
  var PAGE_SIZE=10;
  var curPage=1;
  var LV_CLS={'高危':'high','中危':'mid','低危':'yellow','提示':'green','停车提示':'gray'};
  function cloneData(v){return JSON.parse(JSON.stringify(v));}
  function loadData(){
    try{var raw=localStorage.getItem(STORAGE_KEY);if(raw){var d=JSON.parse(raw);if(Array.isArray(d.cats)&&Array.isArray(d.events)){CATS=d.cats;EVENTS=d.events;EVENTS.forEach(function(e){if(e.ths===undefined)e.ths=defaultThs(e.name);});return;}}}catch(e){console.warn('本地配置读取失败',e);}
    CATS=cloneData(DEFAULT_CATS);EVENTS=cloneData(DEFAULT_EVENTS);
    EVENTS.forEach(function(e){if(e.ths===undefined)e.ths=defaultThs(e.name);});
  }
  function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({cats:CATS,events:EVENTS}));}catch(e){toast('浏览器存储不可用，本次修改仅在当前页面有效');}}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(function(){t.classList.remove('show');},2000);}
  function openLayer(id){var el=document.getElementById(id);if(el)el.classList.add('open');}
  function closeLayer(id){var el=document.getElementById(id);if(el)el.classList.remove('open');}
  function maskClose(e,id){if(e.target.id===id)closeLayer(id);}
  function setCategory(name){activeCategory=name;curPage=1;renderCats();renderEvents();}
  function setCategoryByIndex(i){if(CATS[i])setCategory(CATS[i].name);}
  function renderCats(){
    var evSel=document.getElementById('evCat');
    if(evSel){var old=evSel.value;evSel.innerHTML=CATS.map(function(c){return '<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>';}).join('');if(CATS.some(function(c){return c.name===old;}))evSel.value=old;}
    var nav=document.getElementById('categoryNav');if(nav){var total=EVENTS.length;nav.innerHTML='<div class="category-nav-row '+(!activeCategory?'active':'')+'" onclick="setCategory(\'\')">'+'<span class="category-nav-name">全部分类</span>'+'<span class="category-nav-count">'+total+'</span></div>'+CATS.map(function(c,i){var n=EVENTS.filter(function(e){return e.cat===c.name;}).length;return '<div class="category-nav-row '+(activeCategory===c.name?'active':'')+'" onclick="setCategoryByIndex('+i+')">'+'<span class="category-nav-name" title="'+esc(c.desc)+'">'+esc(c.name)+'</span>'+'<span class="category-nav-actions" onclick="event.stopPropagation()">'+'<button class="category-nav-action" title="编辑分类" onclick="editCat('+i+')"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z\"/></svg></button>'+'<button class="category-nav-action danger" title="删除分类" onclick="delCat('+i+')"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18\"/><path d=\"M8 6V4h8v2\"/><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\"/><path d=\"M10 11v6\"/><path d=\"M14 11v6\"/></svg></button>'+'</span>'+'<span class="category-nav-count">'+n+'</span>'+'</div>';}).join('')+(CATS.length?'':'<div class="empty-category">暂无分类，请先新增</div>');}
  }
  function renderEvents(){
    var cat=(activeCategory || '');
    function gv(id){var el=document.getElementById(id);return el?(el.value||'').trim().toLowerCase():'';}
    var kwName=gv('kwName'), kwThing=gv('kwThing'), kwKey=gv('kwKey');
    var lvlEl=document.getElementById('lvlFilter');
    var lvl=lvlEl?lvlEl.value:'';
    var stEl=document.getElementById('statusFilter');
    var status=stEl?stEl.value:'';

    var all=EVENTS.map(function(e,i){return {e:e,i:i};}).filter(function(x){
      var e=x.e;
      if(cat && e.cat!==cat) return false;
      if(lvl && e.level!==lvl) return false;
      if(status!=='' && String(e.on)!==status) return false;
      if(kwName && (e.name||'').toLowerCase().indexOf(kwName)<0) return false;
      if(kwThing && (e.thing||'').toLowerCase().indexOf(kwThing)<0) return false;
      if(kwKey && (e.key||'').toLowerCase().indexOf(kwKey)<0) return false;
      return true;
    });

    var total=all.length;
    var pages=Math.max(1, Math.ceil(total/PAGE_SIZE));
    if (curPage>pages) curPage=pages;
    if (curPage<1) curPage=1;
    var start=(curPage-1)*PAGE_SIZE;
    var list=all.slice(start, start+PAGE_SIZE);

    var body=document.getElementById('evBody');
    if(!body) return;
    if(!list.length){
      body.innerHTML='<tr><td colspan="9" style="text-align:center;color:#9aa3af;padding:42px">'
        + (EVENTS.length ? '暂无匹配的预警事件' : '暂无预警事件，请点击“新增预警事件”创建') + '</td></tr>';
    } else {
      var tag=function(v){return v?'<span class="tag info">是</span>':'<span class="tag gray">否</span>';};
      body.innerHTML=list.map(function(x){
        var e=x.e, i=x.i;
        return '<tr><td><b>'+esc(e.name)+'</b></td>'
          + '<td class="key-col">'+esc(e.key||'-')+'</td>'
          + '<td><span class="tag '+(LV_CLS[e.level]||'gray')+'">'+esc(e.level)+'</span></td>'
          + '<td><span class="st-toggle" onclick="toggleOn('+i+')"><span class="switch'+(e.on?' on':'')+'"></span><span class="st-txt">'+(e.on?'开启':'关闭')+'</span></span></td>'
          + '<td>'+tag(e.audit)+'</td>'
          + '<td class="ths-col">'+ (e.th  ? '<span class="cell-ell" style="max-width:150px" title="'+esc(e.ths||'')+'">'+(esc(e.ths||'')||'—')+'</span>'  : '<span class="tag gray">否</span>')+ '</td>'
          + '<td class="thing-col" title="'+esc(e.thing)+'">'+esc(e.thing||'-')+'</td>'
          + '<td class="desc-col" title="'+esc(e.desc)+'">'+esc(e.desc||'-')+'</td>'
          + '<td><button class="btn link" onclick="editEv('+i+')">编辑</button>'
          + '<button class="btn link danger" onclick="delEv('+i+')">删除</button></td></tr>';
      }).join('');
    }

    var sum=document.getElementById('resultSummary');
    if(sum){
      sum.textContent='共 '+total+' 条记录';
    }
    renderPager(total);
  }
  renderCats();
  renderEvents();

  function refresh(){renderCats();renderEvents();}
  function resetQuery(){
    curPage=1;['kwName','kwThing','kwKey'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});document.getElementById('lvlFilter').value='';document.getElementById('statusFilter').value='';activeCategory='';refresh();}
  function toggleOn(idx){if(!EVENTS[idx])return;EVENTS[idx].on=EVENTS[idx].on?0:1;persist();refresh();toast(EVENTS[idx].on?'已开启':'已关闭');}
  function newCategory(){curCatIdx=-1;document.getElementById('catTitle').textContent='新增分类';document.getElementById('catName').value='';document.getElementById('catKey').value='';document.getElementById('catDesc').value='';openLayer('catModal');setTimeout(function(){document.getElementById('catName').focus();},50);}
  function editCat(i){if(!CATS[i])return;curCatIdx=i;document.getElementById('catTitle').textContent='编辑分类';document.getElementById('catName').value=CATS[i].name;document.getElementById('catKey').value=CATS[i].key||'';document.getElementById('catDesc').value=CATS[i].desc||'';openLayer('catModal');}
  function saveCat(){var name=(document.getElementById('catName').value||'').trim(),key=(document.getElementById('catKey').value||'').trim(),desc=(document.getElementById('catDesc').value||'').trim();if(!name){toast('请填写分类名称');document.getElementById('catName').focus();return;}if(name.length>20){toast('分类名称不能超过20个字');return;}if(key.length>40){toast('分类键值不能超过40个字符');return;}if(CATS.some(function(c,i){return c.name.toLowerCase()===name.toLowerCase()&&i!==curCatIdx;})){toast('分类名称已存在');return;}if(curCatIdx>=0){var old=CATS[curCatIdx].name;CATS[curCatIdx]={name:name,key:key,desc:desc};EVENTS.forEach(function(e){if(e.cat===old)e.cat=name;});if(activeCategory===old)activeCategory=name;}else{CATS.push({name:name,key:key,desc:desc});}persist();closeLayer('catModal');refresh();toast('分类已保存');}
  function delCat(i){if(!CATS[i])return;delTarget={type:'cat',idx:i};var n=EVENTS.filter(function(e){return e.cat===CATS[i].name;}).length;document.getElementById('delTip').textContent=n?'确定删除该分类？其下的预警事件也将一并删除。':'确定删除该分类？';openLayer('delModal');}
  function newEvent(){if(!CATS.length){toast('请先新增预警分类');newCategory();return;}curEvIdx=-1;document.getElementById('evTitle').textContent='新增预警事件';['evName','evKey','evThing','evDesc'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('evLevel').value='高危';document.getElementById('evOn').value='1';document.getElementById('evAudit').value='1';document.getElementById('evTh').value='1';var thsEl2=document.getElementById('evThs');if(thsEl2)thsEl2.value='';toggleThsField();document.getElementById('evCat').value=activeCategory||CATS[0].name;openLayer('evModal');}
  function editEv(idx){var e=EVENTS[idx];if(!e)return;curEvIdx=idx;document.getElementById('evTitle').textContent='编辑预警事件';document.getElementById('evName').value=e.name;
    var k1=document.getElementById('evKey');if(k1)k1.value=e.key||'';document.getElementById('evThing').value=e.thing||'';document.getElementById('evDesc').value=e.desc||'';document.getElementById('evLevel').value=e.level;document.getElementById('evOn').value=e.on?'1':'0';document.getElementById('evAudit').value=e.audit?'1':'0';document.getElementById('evTh').value=e.th?'1':'0';var thsEl=document.getElementById('evThs');if(thsEl)thsEl.value=e.ths||defaultThs(e.name);toggleThsField();document.getElementById('evCat').value=e.cat;openLayer('evModal');}
  function saveEv(){var name=(document.getElementById('evName').value||'').trim(),cat=document.getElementById('evCat').value,thing=(document.getElementById('evThing').value||'').trim();if(!name){toast('请填写事件名称');document.getElementById('evName').focus();return;}if(name.length>40){toast('事件名称不能超过40个字');return;}if(!cat||!CATS.some(function(c){return c.name===cat;})){toast('请选择有效的所属分类');return;}if(EVENTS.some(function(e,i){return e.cat===cat&&e.name.toLowerCase()===name.toLowerCase()&&i!==curEvIdx;})){toast('该分类下已存在同名事件');return;}var data={cat:cat,name:name,key:((document.getElementById('evKey')||{}).value||'').trim(),level:document.getElementById('evLevel').value,on:document.getElementById('evOn').value==='1'?1:0,audit:document.getElementById('evAudit').value==='1'?1:0,th:document.getElementById('evTh').value==='1'?1:0,thing:thing,ths:(function(){var el=document.getElementById('evThs');var v=el?(el.value||'').trim():'';return (document.getElementById('evTh').value==='1')?v:'';})(),desc:(document.getElementById('evDesc').value||'').trim()};if(curEvIdx>=0)EVENTS[curEvIdx]=data;else EVENTS.push(data);persist();closeLayer('evModal');activeCategory=cat;refresh();toast('预警事件已保存');}
  function delEv(idx){if(!EVENTS[idx])return;delTarget={type:'ev',idx:idx};document.getElementById('delTip').textContent='确定删除该预警事件？删除后不可恢复。';openLayer('delModal');}
  function doDel(){if(!delTarget){closeLayer('delModal');return;}if(delTarget.type==='ev'){EVENTS.splice(delTarget.idx,1);}else{var name=CATS[delTarget.idx]&&CATS[delTarget.idx].name;if(name){CATS.splice(delTarget.idx,1);EVENTS=EVENTS.filter(function(e){return e.cat!==name;});if(activeCategory===name)activeCategory='';}}delTarget=null;persist();closeLayer('delModal');refresh();toast('已删除');}
  function closeCatEdit(i){closeLayer('catListModal');editCat(i);}
  function closeCatDelete(i){closeLayer('catListModal');delCat(i);}
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){['catModal','evModal','catListModal','delModal'].forEach(closeLayer);}if(e.key==='Enter'&&e.target&&e.target.id==='catName'){e.preventDefault();saveCat();}});
  loadData();
  try{refresh();}catch(err){console.error(err);document.getElementById('evBody').innerHTML='<tr><td colspan="9" style="padding:24px;color:#e60012">页面初始化异常：'+esc(err.message)+'</td></tr>';}
  
  function renderPager(total){
    var box=document.getElementById('pager');
    if(!box) return;
    var pages=Math.max(1, Math.ceil(total/PAGE_SIZE));
    if (pages<=1){ box.innerHTML=''; return; }

    var html='';
    html+='<button'+(curPage===1?' disabled':'')+' onclick="goPage('+(curPage-1)+')">上一页</button>';
    for(var i=1;i<=pages;i++){
      html+='<button class="'+(i===curPage?'active':'')+'" onclick="goPage('+i+')">'+i+'</button>';
    }
    html+='<button'+(curPage===pages?' disabled':'')+' onclick="goPage('+(curPage+1)+')">下一页</button>';
    html+='<span class="pager-info">共 '+pages+' 页</span>';
    box.innerHTML=html;
  }

  function goPage(n){
    curPage = n;
    renderEvents();
  }

  function defaultThs(name){
    if (/温度|水温|油温|过热/.test(name)) return '70,75,80';
    if (/离线|超时|时长|疲劳/.test(name)) return '12,24,48';
    if (/速度|超速|加速|减速/.test(name)) return '20,30,40';
    if (/油耗|消耗|液位|占比/.test(name)) return '10,20,30';
    if (/围栏|距离|半径/.test(name)) return '100,200,500';
    if (/压力|电压|转速|电流/.test(name)) return '1,2,3';
    return '1,2,3';
  }

  function toggleThsField(){
    var th = document.getElementById('evTh');
    var box = document.getElementById('thsField');
    if (!th || !box) return;
    box.style.display = th.value === '1' ? '' : 'none';
  }

</script>
</body>
</html>
