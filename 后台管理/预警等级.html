<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预警等级 - SanVIST 通用预警事件中心</title>
  <style>
    :root{--red:#29BECE;--red2:#e9f9fb;--blue:#1899a8;--green:#20b26b;--orange:#fa8c16;--ink:#202936;--muted:#657080;--line:#e5e9ef;--bg:#f4f6f8;--white:#fff;--shadow:0 6px 24px rgba(26,39,60,.09)}
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.logo{font-size:23px;font-weight:900;font-style:italic;color:var(--red);letter-spacing:-1px}.nav:hover{background:#f6f7f9}.nav.active{background:var(--red2);color:var(--red);font-weight:650}.nav.active small{background:#fff;color:var(--red)}
    main{margin-left:218px;padding:88px 24px 30px;min-width:1050px}.page{display:none}.page.active{display:block}.page-head{display:flex;justify-content:flex-end;align-items:center;margin-bottom:18px}.page-head h1{margin:0 0 4px;font-size:24px}
    .btn{height:36px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 15px;cursor:pointer;color:#384353}.btn:hover{border-color:#aeb7c3}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.btn.link{border:0;color:var(--blue);padding:0 5px;background:none;height:auto}.btn.danger{color:var(--red)}
    .card{background:#fff;border:1px solid #edf0f3;border-radius:10px;box-shadow:0 1px 3px rgba(20,35,55,.03);margin-bottom:16px}
    .table-wrap{overflow:auto;padding:0 16px}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{background:#f7f8fa;color:#505b69;font-weight:600;text-align:left;border:1px solid var(--line);padding:11px 12px}.table td{padding:12px;border-bottom:1px solid var(--line);color:#3f4956}.table tr:hover td{background:#fafbfd}.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:12px;font-size:12px}.tag.high{background:#e0f7fa;color:#1899a8}.tag.mid{background:#fff0dc;color:#ed7b0b}.tag.low{background:#eef2f5;color:#657080}.tag.info{background:#e9f7ef;color:#17945b}.tag.gray{background:#f0f2f4;color:#737d89}.dot:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}.footer{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.tab{padding:15px 2px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--red);border-color:var(--red);font-weight:650}.customer:hover{background:#f6f7f9}.customer.active{background:var(--red2);color:var(--red)}
    .drawer-mask,.modal-mask{display:none;position:fixed;inset:0;background:rgba(22,30,40,.42);z-index:30}.drawer-mask.open,.modal-mask.open{display:block}.drawer-head,.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.drawer-foot,.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.x{border:0;background:none;font-size:23px;color:#7d8793;cursor:pointer}.time-item:before{content:"";position:absolute;width:9px;height:9px;background:#fff;border:2px solid var(--blue);border-radius:50%;left:-25px;top:4px}
    .modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:780px;max-height:88vh;background:#fff;border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column}.modal-body{padding:20px 24px;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 18px}.field label{display:block;margin-bottom:6px;color:#4f5967}.field label i{color:var(--red);font-style:normal}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:#3d4652;background:#fff}.field textarea{min-height:68px;resize:vertical}.field.full{grid-column:1/-1}.radio-row{display:flex;gap:20px;padding-top:7px}.switch{position:relative;display:inline-block;width:36px;height:20px;background:#d5d9df;border-radius:10px;cursor:pointer;transition:background .2s;vertical-align:middle}
  .switch.on{background:#29BECE}
  .switch:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}.switch.on:after{left:18px}.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#26313e;color:#fff;padding:10px 18px;border-radius:7px;z-index:60;box-shadow:var(--shadow);display:none}.toast.show{display:block}
    /* ===== 管理后台深色主题导航 ===== */
  .app-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
  .main-wrapper { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .main-wrapper > main { flex: 1; min-width: 0; margin: 0; padding: 24px; min-height: 0; overflow-y: auto; }
  .navbar {
    height: 50px; background: #172742; border-bottom: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; flex-shrink: 0;
  }
  .navbar-left { display: flex; align-items: center; gap: 8px; }
  .navbar .logo { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .navbar-right { display: flex; align-items: center; gap: 20px; font-size: 14px; color: rgba(255,255,255,.72); }
  .navbar-item { display: flex; align-items: center; gap: 6px; cursor: pointer; transition: color .2s; }
  .navbar-item:hover { color: #fff; }
  .sidebar {
    width: 210px; background: #1E3255; border-right: 1px solid rgba(255,255,255,.06);
    display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
  }
  .sidebar-menu { list-style: none; padding: 8px 0; margin: 0; }
  .sidebar-item { position: relative; }
  .sidebar-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    font-size: 14px; color: rgba(255,255,255,.75); text-decoration: none;
    transition: all .2s; cursor: pointer;
  }
  .sidebar-link:hover { color: #fff; background: rgba(255,255,255,.07); }
  .sidebar-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sidebar-submenu { list-style: none; padding: 0; margin: 0; }
  .sidebar-submenu .sidebar-link { padding-left: 42px; font-size: 13px; }
  .sidebar-item.active > .sidebar-link,
  .sidebar-link.active {
    background: linear-gradient(90deg, rgba(41,190,206,0) 0%, #29BECE 100%);
    color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #29BECE;
  }

  .pages{display:flex;gap:7px;align-items:center}
  .pages span{width:31px;height:31px;border:1px solid var(--line);display:grid;place-items:center;border-radius:5px;font-size:13px;color:#4a5462;cursor:pointer;transition:all .14s}
  .pages span:hover{border-color:#29BECE;color:#1899a8}
  .pages .on{background:var(--red);color:#fff;border-color:var(--red)}
</style>
</head>
<body>
  <div class="app-wrapper">
  <nav class="navbar">
    <div class="navbar-left">
      <span class="logo">MySANY</span>
      <span style="font-size:12px;color:rgba(255,255,255,.6);margin-left:4px;">管理后台</span>
    </div>
    <div class="navbar-right">
      <span class="navbar-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        中文
      </span>
      <span class="navbar-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        admin@sany.com.cn
      </span>
    </div>
  </nav>
  <div class="main-wrapper">

      <aside class="sidebar">
      <ul class="sidebar-menu">
        <li class="sidebar-item active">
          <a class="sidebar-link">
            <span class="sidebar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
            预警中心
          </a>
          <ul class="sidebar-submenu">
            <li class="sidebar-item active"><a class="sidebar-link" href="预警等级.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h4V10H3z"/><path d="M10 20h4V4h-4z"/><path d="M17 20h4v-7h-4z"/></svg> 预警等级</a></li>
            <li class="sidebar-item"><a class="sidebar-link" href="预警分类.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 3 12V5a2 2 0 0 1 2-2h7a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.6z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg> 预警分类</a></li>
            <li class="sidebar-item"><a class="sidebar-link" href="预警事件.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4"/><path d="m3 8 4-4 4 4"/><path d="M17 8v12"/><path d="m21 16-4 4-4-4"/></svg> 预警事件</a></li><li class="sidebar-item"><a class="sidebar-link" href="租户设置.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;vertical-align:-2px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>租户设置</a></li>
          </ul>
        </li>
      </ul>
    </aside>
  <main>
    <section class="page active" id="levels">
      <div class="page-head"><button class="btn primary" onclick="openLevelModal()">＋ 新增预警等级</button></div>
      <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>等级编码</th><th>等级名称</th><th>站内信</th><th>邮件</th><th>PUSH</th><th>备注</th><th>操作</th></tr></thead><tbody>
        <tr><td>1</td><td><span class="tag high">高危</span></td><td><span class="switch on" onclick="toggleSwitch(this)"></span></td><td><span class="switch on" onclick="toggleSwitch(this)"></span></td><td><span class="switch on" onclick="toggleSwitch(this)"></span></td><td>危险等级最高，需要立即处理</td><td><button class="btn link" onclick="openLevelModal(this)">编辑</button><button class="btn link" style="color:#e60012" onclick="confirmDelete(this)">删除</button></td></tr>
        <tr><td>2</td><td><span class="tag mid">中危</span></td><td><span class="switch on" onclick="toggleSwitch(this)"></span></td><td><span class="switch on" onclick="toggleSwitch(this)"></span></td><td><span class="switch" onclick="toggleSwitch(this)"></span></td><td>中等危险，需要关注</td><td><button class="btn link" onclick="openLevelModal(this)">编辑</button><button class="btn link" style="color:#e60012" onclick="confirmDelete(this)">删除</button></td></tr>
        <tr><td>3</td><td><span class="tag low">低危</span></td><td><span class="switch on" onclick="toggleSwitch(this)"></span></td><td><span class="switch" onclick="toggleSwitch(this)"></span></td><td><span class="switch" onclick="toggleSwitch(this)"></span></td><td>较低危险</td><td><button class="btn link" onclick="openLevelModal(this)">编辑</button><button class="btn link" style="color:#e60012" onclick="confirmDelete(this)">删除</button></td></tr>
        <tr><td>4</td><td><span class="tag gray">提示</span></td><td><span class="switch on" onclick="toggleSwitch(this)"></span></td><td><span class="switch" onclick="toggleSwitch(this)"></span></td><td><span class="switch" onclick="toggleSwitch(this)"></span></td><td>提示类信息，不属于危险</td><td><button class="btn link" onclick="openLevelModal(this)">编辑</button><button class="btn link" style="color:#e60012" onclick="confirmDelete(this)">删除</button></td></tr>
        <tr><td>5</td><td><span class="tag gray">停车提示</span></td><td><span class="switch" onclick="toggleSwitch(this)"></span></td><td><span class="switch" onclick="toggleSwitch(this)"></span></td><td><span class="switch" onclick="toggleSwitch(this)"></span></td><td>特殊提示，不属于危险</td><td><button class="btn link" onclick="openLevelModal(this)">编辑</button><button class="btn link" style="color:#e60012" onclick="confirmDelete(this)">删除</button></td></tr>
      </tbody></table></div><div class="footer"><span id="totalCount">共 5 条</span><div class="pages"><span class="on" onclick="gotoPage(this)">1</span><span onclick="gotoPage(this)">2</span><span onclick="gotoPage(this)">3</span></div></div></div>
    </section>
  </main>
  </div>
</div>




  <div class="modal-mask" id="levelModal" onclick="maskClose(event,'levelModal')"><div class="modal" style="width:600px"><div class="modal-head"><b style="font-size:18px" id="lvTitle">新增预警等级</b><button class="x" onclick="closeLayer('levelModal')">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label><i>*</i> 等级编码</label><input id="lvCode" value="" inputmode="numeric" maxlength="2" oninput="this.value=this.value.replace(/[^0-9]/g,'')" placeholder="请输入数字"/></div><div class="field"><label><i>*</i> 等级名称</label><input id="lvName" value="" placeholder="如 高危"/></div><div class="field"><label>等级颜色</label><select id="lvColor"><option>红色</option><option>橙色</option><option>蓝色</option><option>灰色</option></select></div><div class="field full"><label>推送渠道</label><div class="radio-row" style="gap:18px"><label style="display:flex;align-items:center;gap:7px"><span class="switch on" onclick="toggleSwitch(this)"></span>站内信</label><label style="display:flex;align-items:center;gap:7px"><span class="switch on" onclick="toggleSwitch(this)"></span>邮件</label><label style="display:flex;align-items:center;gap:7px"><span class="switch on" onclick="toggleSwitch(this)"></span>PUSH</label></div></div><div class="field full"><label>备注</label><input id="lvDesc" value="" placeholder="选填"/></div></div></div><div class="modal-foot"><button class="btn" onclick="closeLayer('levelModal')">取消</button><button class="btn primary" onclick="saveLevel()">保存</button></div></div></div>
  <div class="modal-mask" id="confirmModal" onclick="maskClose(event,'confirmModal')">
    <div class="modal" style="width:400px">
      <div class="modal-head">
        <b style="font-size:17px">确认删除</b>
        <button class="x" onclick="closeLayer('confirmModal')">×</button>
      </div>
      <div class="modal-body">
        <p style="margin:0;font-size:14px;color:#4e5968;line-height:1.7">确定要删除该预警等级吗？<br>删除后其关联的订阅配置将一并失效，且不可恢复。</p>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeLayer('confirmModal')">取消</button>
        <button class="btn" style="background:#e60012;color:#fff;border-color:#e60012" onclick="doDelete()">确认删除</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{t.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active')});
    function openModal(id){document.getElementById(id).classList.add('open')}
    function closeLayer(id){document.getElementById(id).classList.remove('open')}
    function maskClose(e,id){if(e.target.id===id)closeLayer(id)}
    function tableOf(el){return el.closest('.card')}
    function toast(msg){const el=document.getElementById('toast');el.textContent='✓ '+msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
  
  /* 底部记录数：按表格实际行数动态统计 */
  (function () {
    const tb = document.querySelector('tbody');
    const el = document.getElementById('totalCount');
    if (tb && el) el.textContent = '共 ' + tb.querySelectorAll('tr').length + ' 条';
  })();

  function toggleSwitch(el){
    el.classList.toggle('on');
    const on = el.classList.contains('on');
    const td = el.closest('td');
    if (td) {
      const heads = ['站内信','邮件','PUSH'];
      const ch = heads[td.cellIndex - 2] || '订阅';
      const tr = el.closest('tr');
      const lv = tr ? tr.innerText.trim().split(/\s+/)[1] : '';
      toast(lv + ' · ' + ch + (on ? ' 订阅已开启' : ' 订阅已关闭'));
    } else {
      const lb = el.closest('label');
      const name = lb ? lb.textContent.trim() : '订阅';
      toast(name + (on ? ' 订阅已开启' : ' 订阅已关闭'));
    }
  }


  let deleteTarget = null;

  function confirmDelete(btn){
    deleteTarget = btn.closest('tr');
    openModal('confirmModal');
  }

  function doDelete(){
    if (deleteTarget) {
      deleteTarget.remove();
      deleteTarget = null;
      const tb = document.querySelector('tbody');
      const el = document.getElementById('totalCount');
      if (tb && el) el.textContent = '共 ' + tb.querySelectorAll('tr').length + ' 条';
    }
    closeLayer('confirmModal');
    toast('已删除该预警等级');
  }


  let editRow = null;

  function tagClsOf(color){
    return { '红色': 'high', '橙色': 'mid', '蓝色': 'low', '灰色': 'gray' }[color] || 'gray';
  }

  function colorOfTag(td){
    const t = td.querySelector('.tag');
    if (!t) return '灰色';
    if (t.classList.contains('high')) return '红色';
    if (t.classList.contains('mid')) return '橙色';
    if (t.classList.contains('low')) return '蓝色';
    return '灰色';
  }

  function openLevelModal(btn){
    editRow = btn ? btn.closest('tr') : null;
    const title = document.getElementById('lvTitle');
    const sws = document.querySelectorAll('#levelModal .switch');
    if (editRow) {
      const tds = editRow.querySelectorAll('td');
      document.getElementById('lvCode').value = tds[0].innerText.trim();
      document.getElementById('lvName').value = tds[1].innerText.trim();
      document.getElementById('lvColor').value = colorOfTag(tds[1]);
      document.getElementById('lvDesc').value = tds[5].innerText.trim();
      const rowSws = editRow.querySelectorAll('.switch');
      sws.forEach(function(s, i){
        s.classList.toggle('on', rowSws[i] ? rowSws[i].classList.contains('on') : false);
      });
      title.textContent = '编辑预警等级';
    } else {
      document.getElementById('lvCode').value = '';
      document.getElementById('lvName').value = '';
      document.getElementById('lvColor').value = '灰色';
      document.getElementById('lvDesc').value = '';
      sws.forEach(function(s){ s.classList.add('on'); });
      title.textContent = '新增预警等级';
    }
    openModal('levelModal');
  }

  function saveLevel(){
    const code = document.getElementById('lvCode').value.trim();
    const name = document.getElementById('lvName').value.trim();
    const color = document.getElementById('lvColor').value;
    const desc = document.getElementById('lvDesc').value.trim();
    if (!code) { toast('请填写等级编码'); return; }
    if (!name) { toast('请填写等级名称'); return; }

    const sws = document.querySelectorAll('#levelModal .switch');
    const swHtml = Array.prototype.map.call(sws, function(s){
      return '<td><span class="switch' + (s.classList.contains('on') ? ' on' : '') + '" onclick="toggleSwitch(this)"></span></td>';
    }).join('');

    const opHtml = '<td><button class="btn link" onclick="openLevelModal(this)">编辑</button>'
                 + '<button class="btn link" style="color:#e60012" onclick="confirmDelete(this)">删除</button></td>';

    const rowHtml = '<td>' + code + '</td>'
                  + '<td><span class="tag ' + tagClsOf(color) + '">' + name + '</span></td>'
                  + swHtml + '<td>' + desc + '</td>' + opHtml;

    if (editRow) {
      editRow.innerHTML = rowHtml;
    } else {
      const tr = document.createElement('tr');
      tr.innerHTML = rowHtml;
      document.querySelector('tbody').appendChild(tr);
    }

    const tb = document.querySelector('tbody');
    const el = document.getElementById('totalCount');
    if (tb && el) el.textContent = '共 ' + tb.querySelectorAll('tr').length + ' 条';

    closeLayer('levelModal');
    toast(editRow ? '预警等级已更新' : '预警等级已新增');
    editRow = null;
  }


  function gotoPage(el){
    const box = el.parentElement;
    box.querySelectorAll('span').forEach(function(x){ x.classList.remove('on'); });
    el.classList.add('on');
  }

</script>
</body>
</html>
