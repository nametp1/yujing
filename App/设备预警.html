<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>设备预警</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: #dfe2e6;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #333333;
    -webkit-font-smoothing: antialiased;
  }

  .page-container {
    width: 100%;
    max-width: 414px;
    margin: 0 auto;
    background: #f2f3f5;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== 状态栏 ===== */
  .status-bar {
    height: 34px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
  }

  .sb-time {
    font-size: 14px;
    font-weight: 600;
    color: #111111;
    letter-spacing: 0.3px;
  }

  .sb-right {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .sb-battery {
    width: 22px;
    height: 11px;
    border: 1px solid #111111;
    border-radius: 3px;
    position: relative;
    display: flex;
    align-items: center;
    padding: 1.5px;
  }

  .sb-battery::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 50%;
    transform: translateY(-50%);
    width: 2px;
    height: 4px;
    background: #111111;
    border-radius: 0 1px 1px 0;
  }

  .sb-battery i {
    display: block;
    width: 72%;
    height: 100%;
    background: #111111;
    border-radius: 1px;
  }

  /* ===== 导航栏 ===== */
  .nav-bar {
    background: #ffffff;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 16px 12px 6px;
    flex-shrink: 0;
  }

  .nav-back {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .nav-back:active { opacity: 0.5; }

  .nav-title {
    font-size: 21px;
    font-weight: 700;
    color: #111111;
    line-height: 1.25;
    letter-spacing: 0.2px;
    flex: 1;
    min-width: 0;
  }

  .nav-setting {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .nav-setting:active { opacity: 0.5; }

  /* ===== 内容区 ===== */
  .content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 0 20px;
  }

  /* ===== 搜索 ===== */
  .search-wrap {
    padding: 2px 16px 12px;
    background: #ffffff;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    background: #f2f3f5;
    border-radius: 20px;
    padding: 0 14px;
  }

  .search-box svg { flex-shrink: 0; }

  .search-box input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: none;
    background: transparent;
    font-size: 15px;
    color: #333333;
    font-family: inherit;
  }

  .search-box input::placeholder { color: #b0b4ba; }

  /* ===== 筛选行 ===== */
  .filter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px 4px;
    background: #ffffff;
    border-bottom: 1px solid #f0f1f3;
  }

  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 14px;
    background: #f5f6f8;
    border-radius: 16px;
    font-size: 14px;
    color: #333333;
    cursor: pointer;
    white-space: nowrap;
  }

  .filter-chip:active { background: #eceef1; }

  .filter-chip svg { flex-shrink: 0; }

  /* ===== 预警卡片 ===== */
  .warn-list {
    padding: 12px 16px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .warn-card {
    background: #ffffff;
    border-radius: 10px;
    padding: 16px;
  }

  .warn-dev {
    font-size: 17px;
    font-weight: 600;
    color: #111111;
    line-height: 1.35;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f1f3;
  }

  .warn-tags {
    display: flex;
    align-items: center;
    gap: 0;
    margin-top: 12px;
  }

  .warn-tag {
    display: inline-block;
    padding: 4px 10px;
    background: #fff6e6;
    color: #d48806;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
  }

  .lv-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    margin-left: 8px;
  }

  .lv-high   { background: #ffecec; color: #e60012; }
  .lv-medium { background: #fff7e6; color: #fa8c16; }
  .lv-low    { background: #fff8e0; color: #d48806; }
  .lv-info   { background: #e6f7ff; color: #1890ff; }
  .lv-hint   { background: #f4f5f7; color: #8c8c8c; }

  .warn-desc {
    margin-top: 10px;
    font-size: 15px;
    color: #333333;
    line-height: 1.55;
  }

  .warn-time {
    margin-top: 8px;
    font-size: 13px;
    color: #9aa3af;
  }

  .empty {
    padding: 60px 16px;
    text-align: center;
    color: #9aa3af;
    font-size: 14px;
  }

  /* ===== 底部 Tab 栏 ===== */
  .tab-bar {
    height: 58px;
    background: #ffffff;
    border-top: 0.5px solid #f0f0f0;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    padding-bottom: 2px;
  }

  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    color: #8c8c8c;
    font-size: 11px;
    position: relative;
  }

  .tab-item svg { display: block; }

  .tab-item.active {
    color: #e60012;
    font-weight: 600;
  }

  .tab-dot {
    position: absolute;
    top: 0;
    right: 50%;
    margin-right: -20px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #e60012;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 84px;
    transform: translateX(-50%) translateY(12px);
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    font-size: 13.5px;
    padding: 9px 16px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 200;
    max-width: 80%;
    text-align: center;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="page-container">

  <!-- 状态栏 -->
  <div class="status-bar">
    <span class="sb-time">11:23</span>
    <span class="sb-right">
      <svg width="15" height="11" viewBox="0 0 15 11" fill="#111111">
        <rect x="0" y="7" width="2.6" height="4" rx="0.6"></rect>
        <rect x="4" y="5" width="2.6" height="6" rx="0.6"></rect>
        <rect x="8" y="2.5" width="2.6" height="8.5" rx="0.6"></rect>
        <rect x="12" y="0" width="2.6" height="11" rx="0.6"></rect>
      </svg>
      <span style="font-size:11px;font-weight:600;color:#111111;">4G</span>
      <span class="sb-battery"><i></i></span>
    </span>
  </div>

  <!-- 导航栏 -->
  <div class="nav-bar">
    <div class="nav-back" onclick="toast('返回上一页')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </div>
    <div class="nav-title">设备预警</div>
    <div class="nav-setting" onclick="toast('预警设置')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
  </div>

  <!-- 搜索 -->
  <div class="search-wrap">
    <div class="search-box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#b0b4ba" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input id="kw" placeholder="请输入设备昵称或编号" oninput="renderList()"/>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="filter-row">
    <div class="filter-chip" onclick="toast('选择日期范围')">
      <span>11-12 至 11-18</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
    <div class="filter-chip" onclick="toast('选择预警类型')">
      <span>全部</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8c8c8c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>

  <!-- 列表 -->
  <div class="content">
    <div class="warn-list" id="list"></div>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="toast('首页')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      首页
    </div>
    <div class="tab-item" onclick="toast('资产')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.3 7 12 12 20.7 7"></polyline><line x1="12" y1="22" x2="12" y2="12"></line></svg>
      资产
    </div>
    <div class="tab-item active" onclick="toast('审核')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="16 11 18 13 22 9"></polyline></svg>
      审核
    </div>
    <div class="tab-item" onclick="toast('我的')">
      <span class="tab-dot"></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      我的
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var DATA = [
    { dev: 'HSZX2431003332', tag: '长时间怠速', level: '中危', desc: '设备怠速时间已超过10分钟，怠速时间较长，请关注。', time: '2026-11-18 11:23:12' },
    { dev: 'HSZX2431003462', tag: '长时间怠速', level: '中危', desc: '设备怠速时间已超过10分钟，怠速时间较长，请关注。', time: '2026-11-18 11:22:36' },
    { dev: 'HRZX2431014230', tag: '长时间怠速', level: '低危', desc: '设备怠速时间已超过10分钟，怠速时间较长，请关注。', time: '2026-11-18 11:22:16' },
    { dev: 'HRZX2431014148', tag: '长时间怠速', level: '低危', desc: '设备怠速时间已超过10分钟，怠速时间较长，请关注。', time: '2026-11-18 11:21:58' }
  ];

  function lvCls(lv) {
    return { '高危': 'lv-high', '中危': 'lv-medium', '低危': 'lv-low', '提示': 'lv-info', '停车提示': 'lv-hint' }[lv] || 'lv-hint';
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderList() {
    var kw = (document.getElementById('kw').value || '').trim().toLowerCase();
    var rows = DATA.filter(function (d) {
      return !kw || d.dev.toLowerCase().indexOf(kw) > -1 || d.desc.toLowerCase().indexOf(kw) > -1;
    });

    var box = document.getElementById('list');
    if (!rows.length) {
      box.innerHTML = '<div class="empty">没有匹配的设备预警</div>';
      return;
    }

    box.innerHTML = rows.map(function (d) {
      return '<div class="warn-card">'
        + '<div class="warn-dev">' + esc(d.dev) + '</div>'
        + '<div class="warn-tags">'
        + '<span class="warn-tag">' + esc(d.tag) + '</span>'
        + '<span class="lv-tag ' + lvCls(d.level) + '">' + esc(d.level) + '</span>'
        + '</div>'
        + '<div class="warn-desc">' + esc(d.desc) + '</div>'
        + '<div class="warn-time">' + esc(d.time) + '</div>'
        + '</div>';
    }).join('');
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  renderList();
</script>
</body>
</html>
